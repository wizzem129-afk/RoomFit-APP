name: Build iOS App

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build RoomFit for iOS Simulator
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build RoomFit
        run: |
          xcodebuild build \
            -project RoomFit.xcodeproj \
            -scheme RoomFit \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Prepare App for Appetize
        run: |
          APP="build/Build/Products/Debug-iphonesimulator/RoomFit.app"

          if [ ! -d "$APP" ]; then
            echo "Error: RoomFit.app was not found!"
            exit 1
          fi

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP" RoomFit-iOS-Simulator.zip

      - name: Upload RoomFit App
        uses: actions/upload-artifact@v4
        with:
          name: RoomFit-iOS-Simulator
          path: RoomFit-iOS-Simulator.zip
          retention-days: 7