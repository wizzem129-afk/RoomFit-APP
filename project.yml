name: RoomFit
options:
  bundleIdPrefix: com.roomfit
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  RoomFit:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RoomFit
        createIntermediateGroups: true
    settings:
      base:
        PRODUCT_NAME: RoomFit
        PRODUCT_BUNDLE_IDENTIFIER: com.roomfit.app
        INFOPLIST_FILE: RoomFit/Info.plist
        TARGETED_DEVICE_FAMILY: "1" # iPhone
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
